name: Keep Hugging Face Space Awake

on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Hugging Face Space
        run: |
          echo "Pinging Space..."
          curl -L --fail --max-time 180 --retry 3 --retry-delay 15 --retry-all-errors \
            "https://usmannawaz-oldslaviclemma.hf.space/"
          echo "Ping completed."
